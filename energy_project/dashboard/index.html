<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Energy model review</title>
  <meta name="description" content="Forecast and anomaly detection results for the synthetic energy project.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1b2e'/%3E%3Cpath d='M12 39h12l8-20 8 26 6-12h6' fill='none' stroke='%233de0c0' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--bg:#081625;--panel:#102337;--panel2:#142b42;--line:#294057;--text:#edf7fb;--muted:#a8bac8;--teal:#3de0c0;--amber:#f8ba67;--red:#ff7785;--blue:#8bb9ff}
    *{box-sizing:border-box}html{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;font-size:16px}body{margin:0;background:radial-gradient(ellipse at 90% -10%,#163c50 0%,transparent 32%),var(--bg);color:var(--text)}
    a{color:var(--teal)}button,select{font:inherit}button,select{color:var(--text);background:var(--panel2);border:1px solid #3d5970;border-radius:8px;padding:.58rem .75rem}button{cursor:pointer}button:hover,select:hover{border-color:var(--teal)}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
    .wrap{max-width:1360px;margin:auto;padding:28px clamp(18px,3vw,44px) 70px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{color:var(--teal);font-size:.78rem;text-transform:uppercase;letter-spacing:.16em;font-weight:750}.top h1{font-size:clamp(1.7rem,3vw,2.7rem);line-height:1.12;letter-spacing:-.04em;margin:8px 0 8px}.top p{margin:0;color:var(--muted);max-width:750px}.stamp{border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:.88rem;white-space:nowrap}.stamp strong{display:block;color:var(--text);margin-bottom:2px}
    .sectionbar{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:34px 0 15px}.sectionbar h2{font-size:1.35rem;margin:0;letter-spacing:-.02em}.sectionbar p{color:var(--muted);margin:4px 0 0;font-size:.92rem}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.control{display:grid;gap:5px;color:var(--muted);font-size:.8rem;font-weight:650}.control select{font-size:.92rem;min-width:120px}
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.chartcard,.tablecard,.note{background:var(--panel);border:1px solid var(--line);border-radius:14px}.card{padding:18px 20px;min-height:115px}.card .label{font-size:.83rem;color:var(--muted)}.card .value{font-size:clamp(1.45rem,2.6vw,2.25rem);letter-spacing:-.045em;font-weight:750;margin:9px 0 3px;font-variant-numeric:tabular-nums}.card small{color:var(--muted);font-size:.78rem}.teal{color:var(--teal)}.amber{color:var(--amber)}.red{color:var(--red)}
    .chartcard{padding:18px 20px}.charthead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:10px}.charthead h3{margin:0;font-size:1.02rem}.charthead span{font-size:.8rem;color:var(--muted)}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}.legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}.chart{height:310px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.axis{font-size:12px;fill:#9bb1c0}.grid{stroke:#2a4257;stroke-width:1}.plot{fill:none;stroke-width:2;vector-effect:non-scaling-stroke}.tooltip{position:absolute;pointer-events:none;top:12px;right:12px;background:#071422ec;border:1px solid #426077;border-radius:8px;padding:9px 12px;font-size:.82rem;min-width:160px;display:none;line-height:1.5;z-index:1}.chart:focus-within .tooltip{display:block}.chart:hover .tooltip{display:block}
    .two{display:grid;grid-template-columns:1.06fr .94fr;gap:14px;margin-top:14px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{height:210px}.tablecard{padding:18px 20px;overflow-x:auto}.tablecard h3{margin:0 0 14px;font-size:1.02rem}table{border-collapse:collapse;width:100%;font-size:.86rem;white-space:nowrap}th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:10px 9px}td{border-bottom:1px solid #20384d;padding:11px 9px;font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:0}.right{text-align:right}.barbg{width:100%;height:8px;background:#213b4f;border-radius:10px;overflow:hidden}.barbg b{display:block;height:100%;background:var(--teal);border-radius:10px}.status{font-size:.78rem;color:var(--muted)}.explainimage{display:block;width:100%;max-height:330px;object-fit:contain;background:#fff;border-radius:8px}.caption{font-size:.84rem;line-height:1.45;color:var(--muted);margin:10px 0 0}.note{padding:18px 20px;margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.note h3{font-size:.96rem;margin:0 0 6px}.note p{color:var(--muted);line-height:1.5;margin:0;font-size:.89rem}.footer{display:flex;justify-content:space-between;gap:20px;margin-top:24px;color:var(--muted);font-size:.84rem}
    .loading{padding:50px;color:var(--muted)}.error{padding:20px;background:#3f2330;border:1px solid var(--red);border-radius:10px}
    @media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.note{grid-template-columns:1fr}.stamp{white-space:normal}}@media(max-width:580px){.top{display:block}.stamp{margin-top:18px}.sectionbar{display:block}.controls{margin-top:14px}.kpis{gap:8px}.card{padding:14px;min-height:110px}.chartcard,.tablecard{padding:14px}.chart{height:260px}.footer{display:block}.footer span{display:block;margin-top:8px}}@media(prefers-reduced-motion:no-preference){.card,.chartcard{transition:border-color .2s}.card:hover,.chartcard:hover{border-color:#3b6270}}
  </style>
</head>
<body>
<main class="wrap" id="app"><div class="loading">Loading project results…</div></main>
<script>
const fmt=(n,d=1)=>Number(n).toFixed(d);
const pct=(n,d=1)=>`${fmt(n*100,d)}%`;
const label={rf:'Random Forest',xgb:'XGBoost',linear:'Linear Regression',naive:'Current reading',seasonal_naive:'Last week',z:'Z-score',stuck:'Stuck sensor',iso:'Isolation Forest',drop:'Zero outage',combined:'Combined'};
const el=(id)=>document.getElementById(id);
const escapeHtml=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D, state={horizon:'1h',compare:'rf',method:'combined',day:'2018-07-10'};

function shell(){
  el('app').innerHTML=`<header class="top"><div><div class="eyebrow">Energy project / model review</div><h1>Forecasts & anomaly detection</h1><p>Explore held-out results from synthetic appliance readings recorded every 10 minutes.</p></div><div class="stamp"><strong>Completed Colab snapshot</strong>29 Sep 2026<br>Random Forest selected</div></header>
  <section><div class="sectionbar"><div><h2>Consumption forecast</h2><p>24 hours ahead means one reading at that time, not a daily total.</p></div><div class="controls"><label class="control">Forecast horizon<select id="horizon"><option value="1h">1 hour ahead</option><option value="1day">24 hours ahead</option></select></label><label class="control">Compare against<select id="compare"><option value="rf">Random Forest</option><option value="naive">Current reading</option><option value="seasonal_naive">Last week</option></select></label><label class="control">Test day<select id="day"></select></label></div></div>
  <div class="kpis" id="forecast-kpis"></div><div class="chartcard" style="margin-top:14px"><div class="charthead"><h3>Predicted vs actual</h3><span id="forecast-date"></span></div><div class="legend"><span><i style="background:var(--teal)"></i>Actual</span><span><i style="background:var(--amber)"></i><span id="prediction-label">Random Forest</span></span></div><div id="forecast-chart" class="chart" role="img" aria-label="Forecast time series"></div></div><div class="two"><div class="tablecard"><h3>Validation model comparison</h3><table><thead><tr><th>Model</th><th class="right">RMSE</th><th class="right">MAE</th></tr></thead><tbody id="leaderboard"></tbody></table><p class="caption">Random Forest was selected on validation, then refit before its held-out test evaluation. XGBoost was evaluated on validation; this run does not report XGBoost test predictions.</p></div><div class="chartcard"><div class="charthead"><h3>What influences the 1-hour forecast?</h3><span>SHAP · 200 test rows</span></div><a href="./shap_summary.png" target="_blank" rel="noopener noreferrer" aria-label="Open full SHAP summary image"><img class="explainimage" src="./shap_summary.png" alt="SHAP summary for the Random Forest 1-hour forecast; lights and time of day are the strongest displayed influences"></a><p class="caption">The model relies most on lights and time-of-day features in this sample. SHAP describes model behavior; it does not establish cause.</p></div></div></section>
  <section><div class="sectionbar"><div><h2>Anomaly detection</h2><p>Test period: ${escapeHtml(D.testRange[0])}–${escapeHtml(D.testRange[1])}. Select a detector to compare alert quality.</p></div><div class="controls"><label class="control">Detector<select id="method"><option value="combined">Combined</option><option value="z">Z-score</option><option value="stuck">Stuck sensor</option><option value="iso">Isolation Forest</option><option value="drop">Zero outage</option></select></label></div></div><div class="kpis" id="anomaly-kpis"></div><div class="two"><div class="tablecard"><h3>Detectors on the held-out test period</h3><table><thead><tr><th>Method</th><th class="right">Precision</th><th class="right">Recall</th><th class="right">False alerts</th></tr></thead><tbody id="method-table"></tbody></table></div><div class="chartcard"><div class="charthead"><h3>Alert outcomes by day</h3><span>Combined detector · daily rows</span></div><div class="legend"><span><i style="background:var(--teal)"></i>Caught</span><span><i style="background:var(--red)"></i>Missed</span><span><i style="background:var(--amber)"></i>False positive</span></div><div id="anomaly-bars" class="chart mini" role="img" aria-label="Daily anomaly outcomes"></div></div></div>
  <div class="two"><div class="chartcard"><div class="charthead"><h3>An example day with false alerts</h3><span id="example-date"></span></div><div class="legend"><span><i style="background:var(--blue)"></i>Appliance reading</span><span class="teal">● Caught</span><span class="red">● Missed</span><span class="amber">● False positive</span></div><div id="anomaly-example" class="chart mini" role="img" aria-label="Readings and anomaly alert markers"></div></div><div class="tablecard"><h3>Event-level detection</h3><table><thead><tr><th>Anomaly type</th><th class="right">Events</th><th class="right">Caught</th></tr></thead><tbody id="event-table"></tbody></table></div></div></section>
  <aside class="note"><div><h3>How to read the scores</h3><p>RMSE emphasizes large forecast misses; MAE is the average absolute miss. Precision measures how often an alert is correct. Recall measures how many real anomalies are found. Lower forecast errors and higher precision/recall are better.</p></div><div><h3>Scope of this snapshot</h3><p>All results use synthetic data. XGBoost and Random Forest were compared during validation; Random Forest was selected for test evaluation. Exact-zero and sensor-bound anomaly rules rely on the synthetic generator and need real-data validation.</p></div></aside><footer class="footer"><span>Source: completed Colab evaluation · predictions and metrics from the same run</span><span><a href="${D.notebook}" target="_blank" rel="noopener noreferrer">Open the Colab notebook</a></span></footer>`;
  el('horizon').value=state.horizon;el('compare').value=state.compare;el('method').value=state.method;
  el('horizon').addEventListener('change',e=>{state.horizon=e.target.value;populateDays();renderForecast()});
  el('compare').addEventListener('change',e=>{state.compare=e.target.value;renderForecast()});
  el('method').addEventListener('change',e=>{state.method=e.target.value;renderAnomaly()});
  el('day').addEventListener('change',e=>{state.day=e.target.value;renderForecast()});
  populateDays();renderForecast();renderAnomaly();renderAnomalyCharts();renderEvents();
}
function populateDays(){let ds=Object.keys(D.forecastDays[state.horizon]);if(!ds.includes(state.day))state.day=ds[Math.floor(ds.length/2)];el('day').innerHTML=ds.map(d=>`<option value="${d}">${d}</option>`).join('');el('day').value=state.day}
function card(title,value,detail,color=''){return `<div class="card"><div class="label">${title}</div><div class="value ${color}">${value}</div><small>${detail}</small></div>`}
function renderForecast(){
 const h=state.horizon,m=state.compare,rows=D.forecastMetrics.filter(x=>x.split==='test'&&x.horizon===h),chosen=rows.find(x=>x.model===m),rf=rows.find(x=>x.model==='rf'),baseline=rows.find(x=>x.model==='naive');
 el('forecast-kpis').innerHTML=card('Random Forest RMSE',fmt(rf.RMSE,2),'Dataset units · lower is better','teal')+card('Random Forest MAE',fmt(rf.MAE,2),'Average absolute error')+card('Improvement over current reading',`${fmt((1-rf.RMSE/baseline.RMSE)*100,1)}%`,'RMSE reduction','teal')+card('Selected comparison RMSE',fmt(chosen.RMSE,2),`${label[m]} · ${chosen.n.toLocaleString()} test rows`);
 el('prediction-label').textContent=label[m];el('forecast-date').textContent=`${state.day} · ${h==='1h'?'1 hour':'24 hours'} ahead`;
 const a=D.forecastDays[h][state.day];const y=a.map(r=>r[1]),p=a.map(r=>r[m==='rf'?2:m==='naive'?3:4]);
 lineChart(el('forecast-chart'),a.map(r=>r[0]),[{values:y,color:'#3de0c0',name:'Actual'},{values:p,color:'#f8ba67',name:label[m]}],{max:Math.max(...y,...p)*1.07});
 const val=D.forecastMetrics.filter(x=>x.split==='val'&&x.horizon===h).sort((a,b)=>a.RMSE-b.RMSE);
 el('leaderboard').innerHTML=val.map(x=>`<tr style="${x.model===D.selectedModels[h]?'background:#19364a':''}"><td>${label[x.model]}</td><td class="right">${fmt(x.RMSE,2)}</td><td class="right">${fmt(x.MAE,2)}</td></tr>`).join('');
}
function renderAnomaly(){let rows=D.anomalyMetrics.filter(x=>x.split==='test'),r=rows.find(x=>x.method===state.method);
 el('anomaly-kpis').innerHTML=card('Precision',pct(r.precision),`${r.TP} correct alerts / ${r.TP+r.FP} total alerts`,'teal')+card('Recall',pct(r.recall),`${r.TP} detected / ${r.TP+r.FN} real anomalies`)+card('False positive rows',r.FP.toLocaleString(),'Normal readings flagged','amber')+card('F1 score',fmt(r.f1,3),`${label[state.method]} · ${r.n.toLocaleString()} test rows`);
 el('method-table').innerHTML=rows.map(x=>`<tr style="${x.method===state.method?'background:#19364a':''}"><td>${label[x.method]}</td><td class="right">${pct(x.precision)}</td><td class="right">${pct(x.recall)}</td><td class="right">${x.FP.toLocaleString()}</td></tr>`).join('');
}
function svg(tag,attrs){return `<${tag} ${Object.entries(attrs).map(([k,v])=>`${k}="${escapeHtml(v)}"`).join(' ')}>`}
function lineChart(node,labels,series,options={}){
 const w=1000,h=300,l=52,r=14,t=17,b=35,max=options.max||Math.max(...series.flatMap(s=>s.values))*1.08||1,min=0;
 const X=i=>l+i*(w-l-r)/Math.max(1,labels.length-1),Y=v=>t+(max-v)*(h-t-b)/(max-min),ticks=[0,.25,.5,.75,1];
 let html=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">`;
 ticks.forEach(q=>{let v=max*q,yy=Y(v);html+=`<line class="grid" x1="${l}" x2="${w-r}" y1="${yy}" y2="${yy}"/><text class="axis" x="${l-8}" y="${yy+4}" text-anchor="end">${Math.round(v)}</text>`});
 for(let i=0;i<5;i++){let index=Math.round(i*(labels.length-1)/4);html+=`<text class="axis" x="${X(index)}" y="${h-8}" text-anchor="middle">${labels[index]||''}</text>`}
 series.forEach(s=>{const path=s.values.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');html+=`<path class="plot" d="${path}" stroke="${s.color}"/>`});
 html+=`<line id="cursor" x1="0" x2="0" y1="${t}" y2="${h-b}" stroke="#dce8ee" stroke-dasharray="4 4" opacity="0"/><rect x="${l}" y="${t}" width="${w-l-r}" height="${h-t-b}" fill="transparent" class="hit"/></svg><div class="tooltip"></div>`;
 node.innerHTML=html;const rect=node.querySelector('.hit'),cursor=node.querySelector('#cursor'),tip=node.querySelector('.tooltip');
 rect.addEventListener('pointermove',e=>{const box=rect.getBoundingClientRect();let i=Math.max(0,Math.min(labels.length-1,Math.round((e.clientX-box.left)/box.width*(labels.length-1))));cursor.setAttribute('x1',X(i));cursor.setAttribute('x2',X(i));cursor.setAttribute('opacity','1');tip.style.display='block';tip.innerHTML=`<strong>${labels[i]}</strong><br>`+series.map(s=>`<span style="color:${s.color}">${s.name}: ${fmt(s.values[i],1)}</span>`).join('<br>')});
 rect.addEventListener('pointerleave',()=>{cursor.setAttribute('opacity','0');tip.style.display='none'});
}
function renderAnomalyCharts(){
 const a=D.anomalyDaily,weekly=[];for(let i=0;i<a.length;i+=7){let seg=a.slice(i,i+7);weekly.push({date:seg[0].day,caught:seg.reduce((s,x)=>s+x.caught,0),missed:seg.reduce((s,x)=>s+x.missed,0),fp:seg.reduce((s,x)=>s+x.false_positive,0)})}
 let max=Math.max(...weekly.map(x=>x.caught+x.missed+x.fp),1),width=1000,height=200,base=175,plot=155;
 let html=`<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true"><line class="grid" x1="35" x2="990" y1="${base}" y2="${base}"/>`;
 weekly.forEach((x,i)=>{let x0=40+i*945/weekly.length,bw=Math.max(4,945/weekly.length-3),y=base;for(const [v,color] of [[x.caught,'#3de0c0'],[x.missed,'#ff7785'],[x.fp,'#f8ba67']]){let bh=v/max*plot;y-=bh;html+=`<rect x="${x0}" y="${y}" width="${bw}" height="${bh}" fill="${color}"><title>Week from ${x.date}: caught ${x.caught}, missed ${x.missed}, false-positive rows ${x.fp}</title></rect>`}}
 );html+=`<text class="axis" x="40" y="196">${weekly[0].date}</text><text class="axis" x="985" y="196" text-anchor="end">${weekly.at(-1).date}</text></svg>`;el('anomaly-bars').innerHTML=html;
 const detail=D.anomalyExample,rows=detail.rows;el('example-date').textContent=detail.day;
 const labels=rows.map(r=>r[0]);lineChart(el('anomaly-example'),labels,[{values:rows.map(r=>r[1]),color:'#8bb9ff',name:'Appliances'}],{max:Math.max(...rows.map(r=>r[1]))*1.12});
 const svgNode=el('anomaly-example').querySelector('svg'),W=1000,H=300,L=52,R=14,T=17,B=35,maxY=Math.max(...rows.map(r=>r[1]))*1.12||1;
 rows.forEach((row,i)=>{let col=row[2]?(row[3]?'#3de0c0':'#ff7785'):(row[3]?'#f8ba67':null);if(!col)return;let c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',L+i*(W-L-R)/Math.max(1,rows.length-1));c.setAttribute('cy',T+(maxY-row[1])*(H-T-B)/maxY);c.setAttribute('r','4.3');c.setAttribute('fill',col);let title=document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent=`${row[0]} · ${row[2]?(row[3]?'caught':'missed'):'false positive'} · ${row[4]}`;c.append(title);svgNode.append(c)});
}
function renderEvents(){el('event-table').innerHTML=D.events.map(x=>`<tr><td>${escapeHtml(x.anomaly_type.replaceAll('_',' '))}</td><td class="right">${x.events}</td><td class="right">${x.caught}</td></tr>`).join('')}
fetch('./data.json').then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(data=>{D=data;shell()}).catch(err=>{el('app').innerHTML=`<div class="error">Could not load dashboard data: ${escapeHtml(err.message)}</div>`});
</script>
</body>
</html>
