    :root{color-scheme:light;--bg:#f5f7f8;--panel:#fff;--panel2:#fff;--line:#dce3e5;--text:#1d2b30;--muted:#617179;--teal:#067f76;--amber:#b56516;--red:#c34b55;--blue:#4469b0}

    .top{padding:22px 0 20px;align-items:center}.eyebrow{color:var(--teal);letter-spacing:0;font-size:.75rem}.top h1{font-size:1.8rem;letter-spacing:0;margin:5px 0 7px}.top p{font-size:.91rem}.stamp{border:0;border-left:1px solid var(--line);border-radius:0;padding:6px 0 6px 16px;font-size:.8rem}.stamp strong{font-size:.86rem}
    section{scroll-margin-top:20px}.sectionbar{margin:26px 0 12px;align-items:center}.sectionbar h2{font-size:1.14rem;letter-spacing:0}.sectionbar p{font-size:.84rem}.controls{gap:8px}.control{gap:3px;font-size:.72rem}.control select{min-width:116px;padding:.43rem .6rem;font-size:.82rem}.day-control{display:flex;gap:4px;align-items:end}.day-control .control select{min-width:128px}.icon-button{width:31px;height:32px;padding:0;display:grid;place-items:center;font-size:1.12rem;line-height:1;flex:none}.icon-button:disabled{opacity:.35;cursor:default}
    .kpis{gap:8px}.card,.chartcard,.tablecard,.note{border-radius:6px;box-shadow:0 1px 2px #17303908}.card{min-height:97px;padding:13px 15px;border-top:3px solid #dce3e5}.card:first-child{border-top-color:var(--teal)}.card .label{font-size:.76rem}.card .value{font-size:1.65rem;letter-spacing:0;margin:5px 0 2px}.card small{font-size:.72rem}.chartcard,.tablecard{padding:16px 17px}.charthead h3,.tablecard h3{font-size:.93rem}.charthead span{font-size:.75rem}.legend{font-size:.76rem;gap:13px}.legend i{height:2px}.chart{height:290px}.mini{height:205px}.axis{fill:#708188}.grid{stroke:#e8edef}.plot{stroke-width:2.5}.tooltip{background:#fff;border-color:#ccd9db;color:var(--text);box-shadow:0 5px 20px #1a35301f}.two{gap:10px;margin-top:10px}th{color:#566970;background:#f8faf9;font-size:.75rem}td{border-color:#e7ecee}tr.selected{background:#e9f5f1}.tablecard tbody tr:hover{background:#f3f8f7}.barbg{background:#e5efed}.barbg b{background:var(--teal)}.explainimage{max-height:300px}.caption{font-size:.77rem}.note{margin-top:12px;padding:14px 17px;background:#eef4f2}.note h3{font-size:.85rem}.note p{font-size:.79rem}.footer{margin-top:20px;font-size:.76rem}.error{background:#fff1f1}

<body>
<main class="wrap" id="app"><div class="loading">Loading project results…</div></main>
<script>
const fmt=(n,d=1)=>Number(n).toFixed(d);
const pct=(n,d=1)=>`${fmt(n*100,d)}%`;
const label={rf:'Random Forest',xgb:'XGBoost',linear:'Linear Regression',naive:'Current reading',seasonal_naive:'Last week',z:'Z-score',stuck:'Stuck sensor',iso:'Isolation Forest',drop:'Zero outage',combined:'Combined'};
const el=(id)=>document.getElementById(id);
const escapeHtml=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D, state={horizon:'1h',compare:'rf',method:'combined',day:'2018-07-10'};

function shell(){
  el('app').innerHTML=`<div class="mast"><div class="brand"><span class="brandmark" aria-hidden="true">↗</span>Energy model review</div><nav class="nav" aria-label="Sections"><a href="#forecast">Forecast</a><a href="#anomalies">Anomalies</a></nav><span class="run-pill">Synthetic · Completed run</span></div><header class="top"><div><div class="eyebrow">Energy project / model review</div><h1>Energy forecasting & anomaly detection</h1><p>Held-out test results from 10-minute appliance readings. Random Forest was selected on validation.</p></div><div class="stamp"><strong>Evaluation snapshot</strong>29 Sep 2026<br>22,328 forecast test rows</div></header>
  <section id="forecast"><div class="sectionbar"><div><h2>Consumption forecast</h2><p>24 hours ahead means one reading at that time, not a daily total.</p></div><div class="controls"><label class="control">Forecast horizon<select id="horizon"><option value="1h">1 hour ahead</option><option value="1day">24 hours ahead</option></select></label><label class="control">Compare against<select id="compare"><option value="rf">Random Forest</option><option value="naive">Current reading</option><option value="seasonal_naive">Last week</option></select></label><div class="day-control"><button type="button" id="prev-day" class="icon-button" aria-label="Previous test day" title="Previous test day">‹</button><label class="control">Test day<select id="day"></select></label><button type="button" id="next-day" class="icon-button" aria-label="Next test day" title="Next test day">›</button></div></div></div>
  <div class="kpis" id="forecast-kpis"></div><div class="insight" id="forecast-insight" aria-live="polite"></div><div class="chartcard" style="margin-top:10px"><div class="charthead"><h3>Predicted vs actual</h3><span id="forecast-date"></span></div><div class="legend"><span><i style="background:var(--teal)"></i>Actual</span><span><i style="background:var(--amber)"></i><span id="prediction-label">Random Forest</span></span></div><div id="forecast-chart" class="chart" role="img" aria-label="Forecast time series"></div></div><div class="two forecast-analysis"><div class="tablecard"><h3>Validation model comparison</h3><table><thead><tr><th>Model</th><th class="right">RMSE</th><th class="right">MAE</th></tr></thead><tbody id="leaderboard"></tbody></table><p class="caption">Random Forest was selected on validation, then refit before its held-out test evaluation. XGBoost was evaluated on validation; this run does not report XGBoost test predictions.</p></div><div class="chartcard"><div class="charthead"><h3>What influences the 1-hour forecast?</h3><span>SHAP · 200 test rows</span></div><a href="./shap_summary.png" target="_blank" rel="noopener noreferrer" aria-label="Open full SHAP summary image"><img class="explainimage" src="./shap_summary.png" alt="SHAP summary for the Random Forest 1-hour forecast; lights and time of day are the strongest displayed influences"></a><p class="caption">The model relies most on lights and time-of-day features in this sample. SHAP describes model behavior; it does not establish cause.</p></div></div></section>
  <section id="anomalies"><div class="sectionbar"><div><h2>Anomaly detection</h2><p>Test period: ${escapeHtml(D.testRange[0])}–${escapeHtml(D.testRange[1])}. Select a detector to compare alert quality.</p></div><div class="controls"><label class="control">Detector<select id="method"><option value="combined">Combined</option><option value="z">Z-score</option><option value="stuck">Stuck sensor</option><option value="iso">Isolation Forest</option><option value="drop">Zero outage</option></select></label></div></div><div class="kpis" id="anomaly-kpis"></div><div class="insight warning" id="anomaly-insight" aria-live="polite"></div><div class="two"><div class="tablecard"><h3>Detectors on the held-out test period</h3><table><thead><tr><th>Method</th><th class="right">Precision</th><th class="right">Recall</th><th class="right">False alerts</th></tr></thead><tbody id="method-table"></tbody></table></div><div class="chartcard"><div class="charthead"><h3>Alert outcomes by day</h3><span>Combined detector · daily rows</span></div><div class="legend"><span><i style="background:var(--teal)"></i>Caught</span><span><i style="background:var(--red)"></i>Missed</span><span><i style="background:var(--amber)"></i>False positive</span></div><div id="anomaly-bars" class="chart mini" role="img" aria-label="Daily anomaly outcomes"></div></div></div>
  <div class="two"><div class="chartcard"><div class="charthead"><h3>An example day with false alerts</h3><span id="example-date"></span></div><div class="legend"><span><i style="background:var(--blue)"></i>Appliance reading</span><span class="teal">● Caught</span><span class="red">● Missed</span><span class="amber">● False positive</span></div><div id="anomaly-example" class="chart mini" role="img" aria-label="Readings and anomaly alert markers"></div></div><div class="tablecard"><h3>Event-level detection</h3><table><thead><tr><th>Anomaly type</th><th class="right">Events</th><th class="right">Caught</th><th class="right">Rate</th></tr></thead><tbody id="event-table"></tbody></table></div></div></section>
  <aside class="note"><div><h3>How to read the scores</h3><p>RMSE emphasizes large forecast misses; MAE is the average absolute miss. Precision measures how often an alert is correct. Recall measures how many real anomalies are found. Lower forecast errors and higher precision/recall are better.</p></div><div><h3>Scope of this snapshot</h3><p>All results use synthetic data. XGBoost and Random Forest were compared during validation; Random Forest was selected for test evaluation. Exact-zero and sensor-bound anomaly rules rely on the synthetic generator and need real-data validation.</p></div></aside><footer class="footer"><span>Source: completed Colab evaluation · predictions and metrics from the same run</span><span><a href="${D.notebook}" target="_blank" rel="noopener noreferrer">Open the Colab notebook</a></span></footer>`;
  el('horizon').value=state.horizon;el('compare').value=state.compare;el('method').value=state.method;
  el('horizon').addEventListener('change',e=>{state.horizon=e.target.value;populateDays();renderForecast()});
  el('compare').addEventListener('change',e=>{state.compare=e.target.value;renderForecast()});
  el('method').addEventListener('change',e=>{state.method=e.target.value;renderAnomaly()});
  el('day').addEventListener('change',e=>{state.day=e.target.value;renderForecast()});
  el('prev-day').addEventListener('click',()=>stepDay(-1));
  el('next-day').addEventListener('click',()=>stepDay(1));
  populateDays();renderForecast();renderAnomaly();renderAnomalyCharts();renderEvents();
}
function populateDays(){let ds=Object.keys(D.forecastDays[state.horizon]);if(!ds.includes(state.day))state.day=ds[Math.floor(ds.length/2)];el('day').innerHTML=ds.map(d=>`<option value="${d}">${d}</option>`).join('');el('day').value=state.day;el('prev-day').disabled=ds.indexOf(state.day)===0;el('next-day').disabled=ds.indexOf(state.day)===ds.length-1}
function stepDay(delta){const ds=Object.keys(D.forecastDays[state.horizon]),next=ds[ds.indexOf(state.day)+delta];if(next){state.day=next;el('day').value=next;renderForecast()}}
function card(title,value,detail,color=''){return `<div class="card"><div class="label">${title}</div><div class="value ${color}">${value}</div><small>${detail}</small></div>`}
function renderForecast(){
 const h=state.horizon,m=state.compare,rows=D.forecastMetrics.filter(x=>x.split==='test'&&x.horizon===h),chosen=rows.find(x=>x.model===m),rf=rows.find(x=>x.model==='rf'),baseline=rows.find(x=>x.model==='naive');
 el('forecast-kpis').innerHTML=card('Random Forest RMSE',fmt(rf.RMSE,2),'Dataset units · lower is better','teal')+card('Random Forest MAE',fmt(rf.MAE,2),'Average absolute error')+card('Improvement over current reading',`${fmt((1-rf.RMSE/baseline.RMSE)*100,1)}%`,'RMSE reduction','teal')+card('Selected comparison RMSE',fmt(chosen.RMSE,2),`${label[m]} · ${chosen.n.toLocaleString()} test rows`);
 el('forecast-insight').innerHTML=`<strong>Forecast finding</strong><span>Random Forest reduces ${h==='1h'?'1-hour':'24-hour'} RMSE by ${fmt((1-rf.RMSE/baseline.RMSE)*100,1)}% against the current-reading baseline. The chart shows ${escapeHtml(state.day)}.</span>`;
 el('prediction-label').textContent=label[m];el('forecast-date').textContent=`${state.day} · ${h==='1h'?'1 hour':'24 hours'} ahead`;
 const a=D.forecastDays[h][state.day];const y=a.map(r=>r[1]),p=a.map(r=>r[m==='rf'?2:m==='naive'?3:4]);
 lineChart(el('forecast-chart'),a.map(r=>r[0]),[{values:y,color:'#067f76',name:'Actual'},{values:p,color:'#b56516',name:label[m]}],{max:Math.max(...y,...p)*1.07});
 const val=D.forecastMetrics.filter(x=>x.split==='val'&&x.horizon===h).sort((a,b)=>a.RMSE-b.RMSE);
 el('leaderboard').innerHTML=val.map(x=>`<tr class="${x.model===D.selectedModels[h]?'selected':''}"><td>${label[x.model]}${x.model===D.selectedModels[h]?' <span class="status">· selected</span>':''}</td><td class="right">${fmt(x.RMSE,2)}</td><td class="right">${fmt(x.MAE,2)}</td></tr>`).join('');
 populateDays();
}
function renderAnomaly(){let rows=D.anomalyMetrics.filter(x=>x.split==='test'),r=rows.find(x=>x.method===state.method);
 el('anomaly-kpis').innerHTML=card('Precision',pct(r.precision),`${r.TP} correct alerts / ${r.TP+r.FP} total alerts`,'teal')+card('Recall',pct(r.recall),`${r.TP} detected / ${r.TP+r.FN} real anomalies`)+card('False positive rows',r.FP.toLocaleString(),'Normal readings flagged','amber')+card('F1 score',fmt(r.f1,3),`${label[state.method]} · ${r.n.toLocaleString()} test rows`);
 const spike=D.events.find(x=>x.anomaly_type==='spike');
 el('anomaly-insight').innerHTML=`<strong>${label[state.method]}</strong><span>${r.TP} of ${r.TP+r.FN} anomalous readings caught; ${r.FP} normal readings flagged. The combined detector caught ${spike.caught} of ${spike.events} distinct spike events.</span>`;
 el('method-table').innerHTML=rows.map(x=>`<tr class="${x.method===state.method?'selected':''}"><td>${label[x.method]}</td><td class="right">${pct(x.precision)}</td><td class="right">${pct(x.recall)}</td><td class="right">${x.FP.toLocaleString()}</td></tr>`).join('');
}
function svg(tag,attrs){return `<${tag} ${Object.entries(attrs).map(([k,v])=>`${k}="${escapeHtml(v)}"`).join(' ')}>`}
function lineChart(node,labels,series,options={}){
 const w=Math.max(340,Math.round(node.clientWidth)),h=300,l=45,r=14,t=17,b=35,max=options.max||Math.max(...series.flatMap(s=>s.values))*1.08||1,min=0;
 const X=i=>l+i*(w-l-r)/Math.max(1,labels.length-1),Y=v=>t+(max-v)*(h-t-b)/(max-min),ticks=[0,.25,.5,.75,1];
 let html=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">`;
 ticks.forEach(q=>{let v=max*q,yy=Y(v);html+=`<line class="grid" x1="${l}" x2="${w-r}" y1="${yy}" y2="${yy}"/><text class="axis" x="${l-8}" y="${yy+4}" text-anchor="end">${Math.round(v)}</text>`});
 const labelCount=w<500?3:5;
 for(let i=0;i<labelCount;i++){let index=Math.round(i*(labels.length-1)/(labelCount-1));html+=`<text class="axis" x="${X(index)}" y="${h-8}" text-anchor="middle">${labels[index]||''}</text>`}
 series.forEach(s=>{const path=s.values.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');html+=`<path class="plot" d="${path}" stroke="${s.color}"/>`});
 html+=`<line id="cursor" x1="0" x2="0" y1="${t}" y2="${h-b}" stroke="#dce8ee" stroke-dasharray="4 4" opacity="0"/><rect x="${l}" y="${t}" width="${w-l-r}" height="${h-t-b}" fill="transparent" class="hit"/></svg><div class="tooltip"></div>`;
 node.innerHTML=html;const rect=node.querySelector('.hit'),cursor=node.querySelector('#cursor'),tip=node.querySelector('.tooltip');
 rect.addEventListener('pointermove',e=>{const box=rect.getBoundingClientRect();let i=Math.max(0,Math.min(labels.length-1,Math.round((e.clientX-box.left)/box.width*(labels.length-1))));cursor.setAttribute('x1',X(i));cursor.setAttribute('x2',X(i));cursor.setAttribute('opacity','1');tip.style.display='block';tip.innerHTML=`<strong>${labels[i]}</strong><br>`+series.map(s=>`<span style="color:${s.color}">${s.name}: ${fmt(s.values[i],1)}</span>`).join('<br>')});
 rect.addEventListener('pointerleave',()=>{cursor.setAttribute('opacity','0');tip.style.display='none'});
 return {X,Y};
}
function renderAnomalyCharts(){
 const a=D.anomalyDaily,weekly=[];for(let i=0;i<a.length;i+=7){let seg=a.slice(i,i+7);weekly.push({date:seg[0].day,caught:seg.reduce((s,x)=>s+x.caught,0),missed:seg.reduce((s,x)=>s+x.missed,0),fp:seg.reduce((s,x)=>s+x.false_positive,0)})}
 let max=Math.max(...weekly.map(x=>x.caught+x.missed+x.fp),1),width=Math.max(340,el('anomaly-bars').clientWidth),height=200,base=175,plot=155;
 let html=`<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true"><line class="grid" x1="35" x2="${width-10}" y1="${base}" y2="${base}"/>`;
 weekly.forEach((x,i)=>{let x0=40+i*(width-55)/weekly.length,bw=Math.max(4,(width-55)/weekly.length-3),y=base;for(const [v,color] of [[x.caught,'#067f76'],[x.missed,'#c34b55'],[x.fp,'#b56516']]){let bh=v/max*plot;y-=bh;html+=`<rect x="${x0}" y="${y}" width="${bw}" height="${bh}" fill="${color}"><title>Week from ${x.date}: caught ${x.caught}, missed ${x.missed}, false-positive rows ${x.fp}</title></rect>`}}
 );html+=`<text class="axis" x="40" y="196">${weekly[0].date}</text><text class="axis" x="${width-15}" y="196" text-anchor="end">${weekly.at(-1).date}</text></svg>`;el('anomaly-bars').innerHTML=html;
 const detail=D.anomalyExample,rows=detail.rows;el('example-date').textContent=detail.day;
 const labels=rows.map(r=>r[0]),scale=lineChart(el('anomaly-example'),labels,[{values:rows.map(r=>r[1]),color:'#4469b0',name:'Appliances'}],{max:Math.max(...rows.map(r=>r[1]))*1.12});
 const svgNode=el('anomaly-example').querySelector('svg');
 rows.forEach((row,i)=>{let col=row[2]?(row[3]?'#067f76':'#c34b55'):(row[3]?'#b56516':null);if(!col)return;let c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',scale.X(i));c.setAttribute('cy',scale.Y(row[1]));c.setAttribute('r','4.3');c.setAttribute('fill',col);let title=document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent=`${row[0]} · ${row[2]?(row[3]?'caught':'missed'):'false positive'} · ${row[4]}`;c.append(title);svgNode.append(c)});
}
function renderEvents(){el('event-table').innerHTML=D.events.map(x=>`<tr><td>${escapeHtml(x.anomaly_type.replaceAll('_',' '))}</td><td class="right">${x.events}</td><td class="right">${x.caught}</td><td class="right">${x.events?pct(x.caught/x.events):'—'}</td></tr>`).join('')}
let resizeTimer;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(D){renderForecast();renderAnomalyCharts()}},120)});
/* DATA_LOADER_START */
fetch('./data.json').then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(data=>{D=data;shell()}).catch(err=>{el('app').innerHTML=`<div class="error">Could not load dashboard data: ${escapeHtml(err.message)}</div>`});
/* DATA_LOADER_END */
</script>
